name: Rust

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}-${{github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "full"

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Audit Rust Dependencies
      uses: actions-rust-lang/audit@v1

  lint:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Install LLVM tools (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

    - name: Install LLVM tools (windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd $HOME

        # Download source release directly from github
        curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.1/clang+llvm-21.1.1-x86_64-pc-windows-msvc.tar.xz

        # Extract to a known location
        mkdir llvm -p
        tar -xf llvm.tar.xz -C llvm --strip-components=1
        rm -f llvm.tar.xz

        # Add LLVM tools to PATH
        echo "$HOME/llvm/bin" >> $GITHUB_PATH
        echo "RUSTCC_LLVM_CONFIG_PATH=$HOME/llvm/bin/llvm-config.exe" >> $GITHUB_ENV

        # Print version
        $HOME/llvm/bin/llvm-config.exe --version

    - name: Clippy
      run: cargo hack clippy --workspace --feature-powerset --verbose -- -D warnings

  formatting:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt

    - name: Rustfmt Check
      uses: actions-rust-lang/rustfmt@v1

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --all-features --no-deps --document-private-items

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

        toolchain:
          - nightly
          - stable
          - "1.88" # MSRV

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Install LLVM tools (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

    - name: Install LLVM tools (windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd $HOME

        # Download source release directly from github
        curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.1/clang+llvm-21.1.1-x86_64-pc-windows-msvc.tar.xz

        # Extract to a known location
        mkdir llvm -p
        tar -xf llvm.tar.xz -C llvm --strip-components=1
        rm -f llvm.tar.xz

        # Add LLVM tools to PATH
        echo "$HOME/llvm/bin" >> $GITHUB_PATH
        echo "RUSTCC_LLVM_CONFIG_PATH=$HOME/llvm/bin/llvm-config.exe" >> $GITHUB_ENV

        # Print version
        $HOME/llvm/bin/llvm-config.exe --version

    - name: Build
      run: cargo build --workspace --verbose

    - name: Run tests
      run: cargo hack test --workspace --feature-powerset --verbose

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly

    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Run cargo-tarpaulin
      run: cargo tarpaulin --verbose --workspace --all-targets --all-features --follow-exec --locked --post-test-delay 2 --out Xml --engine llvm

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
