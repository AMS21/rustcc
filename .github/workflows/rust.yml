name: Rust

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}-rust
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Audit Rust Dependencies
      uses: actions-rust-lang/audit@v1

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Install LLVM
      run: meta/ci/install-llvm-ubuntu.sh

    - name: Clippy
      run: cargo hack clippy --workspace --feature-powerset --verbose -- -D warnings

  formatting:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt

    - name: Rustfmt Check
      uses: actions-rust-lang/rustfmt@v1

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install LLVM
      run: meta/ci/install-llvm-ubuntu.sh

    - name: Build documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --all-features --no-deps --document-private-items

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        toolchain:
          - nightly
          - stable
          - "1.88" # MSRV

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}

    - name: Install LLVM (Linux)
      if: runner.os == 'Linux'
      run: meta/ci/install-llvm-ubuntu.sh

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: meta/ci/install-llvm-macos.sh

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      run: meta\ci\install-llvm-windows.ps1

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Build
      run: cargo build --workspace --verbose

    - name: Run tests
      run: cargo hack test --workspace --feature-powerset --verbose
