version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "04:00"
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: monthly
      time: "04:00"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: monthly
      time: "04:00"
