[package]
name = "rustcc_driver"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
clap = { workspace = true, features = ["cargo"] }
rustcc_diagnostic = { path = "../rustcc_diagnostic", default-features = false }
rustcc_codegen = { path = "../rustcc_codegen" }
rustcc_source = { path = "../rustcc_source" }
rustcc_parser = { path = "../rustcc_parser", default-features = false }
rustcc_lexer = { path = "../rustcc_lexer", default-features = false }
rustcc_llvm = { path = "../rustcc_llvm" }

[features]
default = ["color"]
color = ["rustcc_diagnostic/color", "rustcc_parser/color", "rustcc_lexer/color"]

[lints]
workspace = true
