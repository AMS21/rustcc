[workspace]
resolver = "2"
members = [
    "crates/rustcc",
    "crates/rustcc_ast",
    "crates/rustcc_codegen",
    "crates/rustcc_diagnostic",
    "crates/rustcc_driver",
    "crates/rustcc_lexer",
    "crates/rustcc_llvm",
    "crates/rustcc_parser",
    "crates/rustcc_source",
]
exclude = ["fuzz"]

[workspace.package]
authors = ["AMS21 <ams21.github@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/AMS21/rustcc"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
assert_cmd = "2.2.0"
bindgen = { version = "0.72.1", default-features = false }
clap = { version = "4.6.0", features = ["cargo"] }
elsa = "1.11.2"
pastey = "0.2.1"
phf = { version = "0.13.1", features = ["macros"] }
rustc-hash = "2.1.2"
semver = { version = "1.0.27", default-features = false }
similar = "2.7.0"
tempfile = { version = "3.27.0", default-features = false }

# Configure lints
[workspace.lints.rust]
#unknown_lints = "warn"
non_ascii_idents = "deny"
missing_debug_implementations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
# Allowed lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Enable clippy lint groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Enable specific clippy restriction lints
allow_attributes = "warn"
as_underscore = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
mem_forget = "warn"
missing_asserts_for_indexing = "warn"
multiple_inherent_impl = "warn"
needless_raw_strings = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

# Denied clippy lints
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
missing_assert_message = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ref_patterns = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# Enable full LTO for release builds
[profile.release]
codegen-units = 1
lto = "fat"

# Enable high optimizations for dependencies but not for our code
[profile.dev.package."*"]
opt-level = 3
